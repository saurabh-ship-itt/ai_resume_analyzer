version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: resume_db
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:mysql://db:3306/resume_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  db-data:
